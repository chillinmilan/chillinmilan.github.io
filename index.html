<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milan Gamble</title>
  <meta name="description" content="Milan Gamble — product management leader at Qualtrics, previously MicroStrategy and the Peace Corps." />
  <meta name="theme-color" content="#101b29" />

  <!-- Link previews (Open Graph / Twitter) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://milangamble.com" />
  <meta property="og:title" content="Milan Gamble" />
  <meta property="og:description" content="Product management leader at Qualtrics, previously MicroStrategy and the Peace Corps." />
  <meta property="og:image" content="https://milangamble.com/P1040274-straight.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%B5%3C/text%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Hanken+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

  <div class="bg" id="bg"></div>
  <div class="overlay"></div>

  <main>
    <div class="name-block">
      <h1>Milan Gamble</h1>
    </div>

    <div class="detail-block">
      <div class="bio">
        <p>Manager, Product Manager at <strong>Qualtrics</strong> (previously Clarabridge)</p>
        <p>way back, <strong>MicroStrategy</strong> and the <strong>Peace Corps</strong></p>
        <p>w/ a BS in Math from <strong>Virginia Tech</strong></p>
      </div>
      <div class="links">
        <a class="icon-btn" href="https://linkedin.com/in/milangamble" target="_blank" rel="noopener" aria-label="Milan Gamble on LinkedIn (opens in a new tab)">
          <i class="fab fa-linkedin-in" aria-hidden="true"></i>
        </a>
        <a class="icon-btn" href="mailto:hire@milangamble.com" aria-label="Email Milan Gamble">
          <i class="fas fa-envelope" aria-hidden="true"></i>
        </a>
      </div>
    </div>
  </main>

  <script>
    const bg = document.getElementById('bg');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let targetX = 0, targetY = 0;
    let curX = 0, curY = 0;

    document.addEventListener('mousemove', (e) => {
      targetX = (e.clientX / window.innerWidth) - 0.5;
      targetY = (e.clientY / window.innerHeight) - 0.5;
    });

    document.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      targetX = (t.clientX / window.innerWidth) - 0.5;
      targetY = (t.clientY / window.innerHeight) - 0.5;
    }, { passive: true });

    function animate() {
      curX += (targetX - curX) * 0.06;
      curY += (targetY - curY) * 0.06;
      bg.style.transform = `translate(${-curX * 28}px, ${-curY * 16}px)`;
      requestAnimationFrame(animate);
    }

    if (!reducedMotion.matches) {
      animate();
    }
  </script>

</body>
</html>
